[project]
name = "MySmartWallet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DataPyPeil", email = "peillon.clement74@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "pdfplumber>=0.11.10",
    "pyside6>=6.11.1",
    "tabula-py>=2.10.0",
]

[project.scripts]
mysmartwallet = "mysmartwallet:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff.lint]
ignore=[
    "DTZ007",
    "N999",
]